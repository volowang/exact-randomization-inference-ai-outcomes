[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exact-randomization-inference-ai-outcomes"
version = "0.1.0"
description = "Exact randomization intervals for binary AI-system outcomes."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Jingxin Wang" }]
license = { text = "MIT" }
keywords = [
  "randomization-inference",
  "causal-inference",
  "exact-confidence-intervals",
  "binary-outcomes",
  "ai-evaluation",
]

[tool.setuptools.packages.find]
include = ["exact_ai_inference*"]

